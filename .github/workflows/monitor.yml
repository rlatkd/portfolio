name: Production availability
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  deployment_status:
permissions:
  contents: read
concurrency:
  group: production-monitor
  cancel-in-progress: false
jobs:
  smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/monitor.mjs
        env:
          MONITOR_ATTEMPTS: 3
  deployment-failure:
    if: >-
      github.event_name == 'deployment_status' &&
      (github.event.deployment_status.state == 'failure' || github.event.deployment_status.state == 'error') &&
      (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production')
    runs-on: ubuntu-latest
    steps:
      - name: Report failed production deployment
        run: |
          echo '::error::Production deployment failed. Inspect the Vercel deployment logs and roll back if required.'
          exit 1
