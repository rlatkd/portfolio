name: External content health
on:
  schedule:
    - cron: '23 1 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: content-health
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p test-results
      - run: node scripts/check-images.mjs --backup > test-results/external-images.json
      - if: always()
        run: node scripts/check-links.mjs > test-results/external-links.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-content-health
          path: |
            test-results/*.json
            test-results/image-backup/
          retention-days: 30
